<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para la más hermosa</title>
<style>
html,body{margin:0;height:100%;background:#05050a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#box{position:relative;height:min(100vh,calc(100vw*975/412));aspect-ratio:412/975;background:#000;overflow:hidden}
#vwrap{position:absolute;left:0;right:0;top:0;height:74.67%;overflow:hidden}
video{width:100%;height:100%;display:block;transform:scale(1.08);transform-origin:50% 62%;
  filter:brightness(1.55) contrast(1.35) saturate(1.9)}
canvas{position:absolute;left:0;top:74.67%;width:100%;height:25.33%;pointer-events:none}
</style></head><body>
<div id="box"><div id="vwrap"><video id="v" autoplay muted loop playsinline preload="auto"></video></div><canvas id="c"></canvas></div>
<script>
const v=document.getElementById('v'),cv=document.getElementById('c'),ctx=cv.getContext('2d'),box=document.getElementById('box');
v.src="flores.mp4";
v.play().catch(()=>document.body.addEventListener('click',()=>v.play(),{once:true}));

// misma cuadrícula de caracteres que las flores (~5 x 9.5 px por celda)
const COLS=82, ROWS=25;
const RAMP="$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/|()1{}[]?-_+~<>i!lI;:,^`'. ";
const LINES=["PARA LA","MÁS","HERMOSA"], CY=[3.9,11.6,19.3];
const STARTS=[4.5,7.5,10.5];            // cada línea entra mientras crece el ramo
const PAL=[[255,61,127],[255,111,165],[255,255,255],[255,200,60],[192,76,240],[255,122,60]];
let cells=[];

function build(){
  const cw=10,ch=19,big=document.createElement('canvas');big.width=COLS*cw;big.height=ROWS*ch;
  const g=big.getContext('2d');g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  const F=fs=>`900 ${fs}px "DejaVu Sans","Arial Black",Arial,sans-serif`;
  let fs=ch*10;g.font=F(fs);
  const wmax=Math.max(...LINES.map(l=>g.measureText(l).width));fs*=Math.min(1,COLS*cw*0.9/wmax);g.font=F(fs);
  LINES.forEach((l,i)=>{
    g.save();g.translate(COLS*cw/2,CY[i]*ch);g.scale(1,1.3);
    g.lineJoin='round';g.lineWidth=ch*.2;g.strokeStyle='#fff';g.strokeText(l,0,0);g.fillText(l,0,0);g.restore();
  });
  const sm=document.createElement('canvas');sm.width=COLS;sm.height=ROWS;const s=sm.getContext('2d',{willReadFrequently:true});
  s.drawImage(big,0,0,COLS,ROWS);const d=s.getImageData(0,0,COLS,ROWS).data;
  cells=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const a=d[(y*COLS+x)*4]/255;if(a<.1)continue;
    const idx=Math.min(RAMP.length-2,Math.floor(Math.random()*5+(1-a)*14));
    const line=y<7.7?0:y<15.5?1:2;
    const p=(x/COLS)*(PAL.length-1),i0=Math.floor(p),f=p-i0,c0=PAL[i0],c1=PAL[Math.min(PAL.length-1,i0+1)];
    const m=.9+.1*Math.sin(x*1.3+y*.7);
    const col=c0.map((u,j)=>Math.min(255,(u+(c1[j]-u)*f)*m|0));
    cells.push({x,y,ch:RAMP[idx],col:`rgb(${col})`,t:STARTS[line]+(x/COLS)*1.4+Math.random()*.15});
  }
}
function size(){const dpr=Math.min(2,devicePixelRatio||1);cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr}
build();size();addEventListener('resize',size);
function tick(){
  requestAnimationFrame(tick);
  const c=v.currentTime,d=v.duration||17.5,W=cv.width,H=cv.height,cw=W/COLS,ch=H/ROWS;
  ctx.clearRect(0,0,W,H);
  if(c<STARTS[0])return;
  ctx.globalAlpha=c>d-1.6?Math.max(0,(d-c)/1.6):1;
  ctx.font=`bold ${ch*.98}px ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace`;ctx.textBaseline='top';
  for(const q of cells){if(c<q.t)continue;ctx.fillStyle=q.col;ctx.fillText(q.ch,q.x*cw,q.y*ch)}
}
tick();
</script></body></html>
